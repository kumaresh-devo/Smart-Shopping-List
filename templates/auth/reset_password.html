<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Smart Shopping List</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h2 class="auth-title">Reset <span class="text-success">Password</span></h2>
      <p class="auth-subtitle">Please enter and confirm your new password</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-3">
          {% for category, message in messages %}
            <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show p-2 px-3 small" role="alert" style="border-radius: 8px;">
              {{ message }}
              <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
      <div class="mb-3">
        <label for="password" class="form-label-custom">New Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius: var(--radius-md) 0 0 var(--radius-md);"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" class="form-control form-control-custom border-start-0" id="password" name="password" placeholder="At least 6 characters" minlength="6" required style="border-radius: 0 var(--radius-md) var(--radius-md) 0;">
        </div>
      </div>

      <div class="mb-4">
        <label for="confirm_password" class="form-label-custom">Confirm New Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius: var(--radius-md) 0 0 var(--radius-md);"><i class="bi bi-shield-check text-muted"></i></span>
          <input type="password" class="form-control form-control-custom border-start-0" id="confirm_password" name="confirm_password" placeholder="Re-enter your new password" minlength="6" required style="border-radius: 0 var(--radius-md) var(--radius-md) 0;">
        </div>
      </div>

      <button type="submit" class="btn btn-green w-100 py-2 justify-content-center mb-3">
        <i class="bi bi-check2-circle"></i>
        <span>Reset Password</span>
      </button>

      <div class="text-center text-muted small">
        <a href="{{ url_for('auth.login') }}" class="text-success fw-bold text-decoration-none">Back to Login</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
