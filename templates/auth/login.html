<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Shopping List</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <i class="bi bi-cart-check-fill"></i>
      </div>
      <h2 class="auth-title">Smart <span class="text-success">Shopping List</span></h2>
      <p class="auth-subtitle">Welcome back! Please login to your account</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-3">
          {% for category, message in messages %}
            <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show p-2 px-3 small" role="alert" style="border-radius: 8px;">
              {{ message }}
              <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('auth.login') }}" method="POST" autocomplete="on">
      <div class="mb-3">
        <label for="email" class="form-label-custom">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius: var(--radius-md) 0 0 var(--radius-md);"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" class="form-control form-control-custom border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required style="border-radius: 0 var(--radius-md) var(--radius-md) 0;">
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="password" class="form-label-custom mb-0">Password</label>
          <a href="{{ url_for('auth.forgot_password') }}" class="text-success small text-decoration-none fw-semibold">Forgot Password?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius: var(--radius-md) 0 0 var(--radius-md);"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" class="form-control form-control-custom border-start-0" id="password" name="password" placeholder="Enter your password" required style="border-radius: 0 var(--radius-md) var(--radius-md) 0;">
        </div>
      </div>

      <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="remember" name="remember">
        <label class="form-check-label text-muted small" for="remember">Remember me</label>
      </div>

      <button type="submit" class="btn btn-green w-100 py-2 justify-content-center mb-3">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Login</span>
      </button>

      <div class="text-center text-muted small">
        Don't have an account? <a href="{{ url_for('auth.signup') }}" class="text-success fw-bold text-decoration-none">Sign Up</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
