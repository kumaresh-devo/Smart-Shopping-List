{% extends 'base.html' %}

{% block title %}Page Not Found (404){% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-12 col-md-6 text-center">
    <div class="card-custom py-5">
      <div class="brand-icon mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
        <i class="bi bi-question-lg"></i>
      </div>
      <h2 class="fw-bold text-main">404 - Page Not Found</h2>
      <p class="text-muted mb-4">The page or resource you are looking for does not exist or has been moved.</p>
      <a href="{{ url_for('dashboard.dashboard_view') }}" class="btn btn-green">
        <i class="bi bi-house-door-fill"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
